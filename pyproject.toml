[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-deepresearch"
version = "0.3.0"
readme = "README.md"
keywords = ["mcp", "x", "twitter", "research", "ai-agents", "social-media-analytics"]
description = "X-deepresearch: read-only MCP research, JST trends, comparisons and coverage diagnostics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "mcp==2.3.0",
    "pydantic-settings>=2.7,<3.0",
    "twikit==2.3.3",
    "Js2Py-3.13==0.74.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
x-deepresearch = "app.stdio:main"
x-deepresearch-setup = "app.setup_cli:main"
x-deepresearch-auth = "app.auth_cli:main"
x-deepresearch-doctor = "app.doctor:main"

[project.urls]
Repository = "https://github.com/taxma604/X-deepresearch"
Issues = "https://github.com/taxma604/X-deepresearch/issues"
Documentation = "https://github.com/taxma604/X-deepresearch/blob/main/docs/clients.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.setuptools.packages.find]
include = ["app*"]
