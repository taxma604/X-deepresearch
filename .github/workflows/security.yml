name: Security audit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and audit tool
        run: |
          python -m pip install uv==0.12.23
          uv sync --extra dev --locked
      - name: Audit installed dependency tree
        run: uv run --locked --with pip-audit python -m pip_audit
  history-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan entire reachable Git history for common credential signatures
        run: python scripts/check_git_secrets.py
  full-history-trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all reachable Git revisions for verified credentials
        shell: bash
        run: |
          # Avoid printing any credential match into GitHub Actions logs.
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog:3.99.0 \
            git file:///repo --only-verified --fail --no-update \
            > "$RUNNER_TEMP/trufflehog-full-history.log" 2>&1 || {
              echo "::error::The full-history credential audit failed. Keep this repository private."
              exit 1
            }
          echo "Full-history TruffleHog scan completed without verified findings."
