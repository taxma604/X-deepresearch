name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    # Do not accidentally publish a release while this repo is still private.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    concurrency:
      group: x-deepresearch-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          package = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = "v" + package["project"]["version"]
          if tag != expected:
              raise SystemExit(f"Tag mismatch: {tag!r} != {expected!r}")
          notes = pathlib.Path("docs/releases") / f"{tag}.md"
          if not notes.is_file():
              raise SystemExit(f"Missing release notes: {notes}")
          print("Validated", tag, "and", notes)
          PY
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --extra dev --locked
      - name: Lint and offline tests
        run: |
          uv run --locked ruff check .
          uv run --locked pytest -q
      - name: Build distribution archives
        run: uv build --out-dir dist
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m venv /tmp/x-deepresearch-release-smoke
          /tmp/x-deepresearch-release-smoke/bin/python -m pip install dist/x_deepresearch-*.whl
          test -x /tmp/x-deepresearch-release-smoke/bin/x-deepresearch
          test -x /tmp/x-deepresearch-release-smoke/bin/x-deepresearch-setup
          /tmp/x-deepresearch-release-smoke/bin/x-deepresearch-setup --help > /dev/null
      - name: Publish GitHub Release with wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its immutable published assets unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/x_deepresearch-*.whl dist/x_deepresearch-*.tar.gz \
            --verify-tag \
            --title "X-deepresearch $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
