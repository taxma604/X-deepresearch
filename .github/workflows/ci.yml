name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install uv==0.12.23
          uv sync --extra dev --locked
      - name: Ruff
        run: uv run --locked ruff check .
      - name: Tests
        run: uv run --locked pytest -q
      - name: Compile
        run: uv run --locked python -m compileall -q app tests
      - name: Build sdist and wheel
        run: |
          uv build --out-dir dist
      - name: Check Japanese README in sdist
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(sdists) == 1, sdists
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/README.ja.md") for name in names), names
          PY
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/x-research-release-test
          /tmp/x-research-release-test/bin/python -m pip install dist/x_deepresearch-*.whl
          test -x /tmp/x-research-release-test/bin/x-deepresearch
          test -x /tmp/x-research-release-test/bin/x-deepresearch-setup
          cd /tmp
          /tmp/x-research-release-test/bin/python -c "import app.stdio, app.auth_cli, app.mcp_server; print('wheel smoke: ok')"
